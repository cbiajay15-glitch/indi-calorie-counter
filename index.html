<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Indi Calorie Counter</title>
<meta name="description" content="A simple calorie counter for Indian food. No ads, no account, data stays on your phone.">
<meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1312" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root {
  --bg: #f5f1e8;
  --bg-2: #efe8da;
  --surface: #ffffff;
  --surface-2: #f2eee5;
  --text: #1c2421;
  --muted: #6b746f;
  --line: #e8e2d6;
  --brand: #0f6b57;
  --brand-2: #138a6e;
  --brand-soft: #dff0ea;
  --accent: #f2a516;
  --accent-soft: #fdf0d4;
  --protein: #4a7be0;
  --carbs: #f2a516;
  --fat: #e0578f;
  --water: #2b9ad6;
  --danger: #d6453a;
  --hero-1: #0f6b57;
  --hero-2: #1b9b7a;
  --hero-3: #f2a516;
  --meal-breakfast: #fdebd3;
  --meal-lunch: #fff4c7;
  --meal-snacks: #f3e6fb;
  --meal-dinner: #e2eafc;
  --shadow: 0 1px 2px rgba(28,36,33,.04), 0 8px 24px rgba(28,36,33,.07);
  --shadow-lg: 0 10px 30px rgba(15,107,87,.28);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1312; --bg-2: #121a18; --surface: #172020; --surface-2: #1f2a28; --text: #eaf0ed; --muted: #98a5a0;
    --line: #26322f; --brand: #4cc6a5; --brand-2: #37a98a; --brand-soft: #18342d; --accent: #f5b53a; --accent-soft: #3a2f17;
    --protein: #82a8ff; --carbs: #f5b53a; --fat: #f07fae; --water: #5cbcec; --danger: #f2756a;
    --hero-1: #0d4a3d; --hero-2: #12735c; --hero-3: #b9800f;
    --meal-breakfast: #3a2c1a; --meal-lunch: #383217; --meal-snacks: #30223a; --meal-dinner: #1e2a40;
    --shadow: none; --shadow-lg: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1312; --bg-2: #121a18; --surface: #172020; --surface-2: #1f2a28; --text: #eaf0ed; --muted: #98a5a0;
  --line: #26322f; --brand: #4cc6a5; --brand-2: #37a98a; --brand-soft: #18342d; --accent: #f5b53a; --accent-soft: #3a2f17;
  --protein: #82a8ff; --carbs: #f5b53a; --fat: #f07fae; --water: #5cbcec; --danger: #f2756a;
  --hero-1: #0d4a3d; --hero-2: #12735c; --hero-3: #b9800f;
  --meal-breakfast: #3a2c1a; --meal-lunch: #383217; --meal-snacks: #30223a; --meal-dinner: #1e2a40;
  --shadow: none; --shadow-lg: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:active { transform: scale(.97); }
.app { max-width: 520px; margin: 0 auto; min-height: 100vh; padding: 0 16px calc(100px + env(safe-area-inset-bottom)); }
/* plain header (weight, settings) */
header.top {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: calc(14px + env(safe-area-inset-top)) 0 10px; display: flex; align-items: center; gap: 10px;
}
.brand { font-weight: 750; font-size: 20px; letter-spacing: -.02em; flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.brand span { overflow: hidden; text-overflow: ellipsis; }
.brand img { width: 32px; height: 32px; flex: none; border-radius: 9px; }
.iconbtn {
  width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  display: inline-grid; place-items: center; font-size: 18px; line-height: 1;
}
.iconbtn:disabled { opacity: .35; cursor: default; }
/* hero (today) */
.hero-card {
  margin: calc(10px + env(safe-area-inset-top)) 0 14px; padding: 18px 18px 20px; border-radius: 26px; color: #fff;
  background:
    radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--hero-3) 55%, transparent) 0%, transparent 55%),
    linear-gradient(145deg, var(--hero-1), var(--hero-2));
  box-shadow: var(--shadow-lg); position: relative; overflow: hidden;
}
.hero-card::after {
  content: ""; position: absolute; right: -40px; bottom: -60px; width: 180px; height: 180px; border-radius: 50%;
  background: rgba(255,255,255,.07); pointer-events: none;
}
.hero-top { display: flex; align-items: flex-start; gap: 10px; }
.hello { font-size: 21px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
.app-name { font-size: 12px; opacity: .85; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; margin-bottom: 2px; }
.hero-top .who { flex: 1; min-width: 0; }
.datenav { display: flex; align-items: center; gap: 4px; flex: none; background: rgba(255,255,255,.14); border-radius: 14px; padding: 3px; }
.datenav button {
  width: 30px; height: 30px; border-radius: 10px; border: 0; background: rgba(255,255,255,.18); color: #fff;
  display: grid; place-items: center; font-size: 18px; line-height: 1;
}
.datenav button:disabled { opacity: .35; }
.datenav span { min-width: 72px; text-align: center; font-size: 13px; font-weight: 650; }
.hero-main { display: grid; grid-template-columns: 148px 1fr; gap: 16px; align-items: center; margin-top: 14px; position: relative; z-index: 1; }
.ring { position: relative; width: 148px; height: 148px; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .big { font-size: 34px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.ring .lbl { font-size: 12px; opacity: .85; }
.hero-stats { display: grid; gap: 8px; }
.pill {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border-radius: 14px;
  background: rgba(255,255,255,.14); font-size: 13px;
}
.pill b { font-size: 16px; font-variant-numeric: tabular-nums; }
.pill .ic { opacity: .9; }
/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px; margin: 12px 0; box-shadow: var(--shadow); }
.card h2 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; letter-spacing: -.01em; }
.card h2 small { font-weight: 500; color: var(--muted); font-size: 13px; }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mac { padding: 12px 10px; border-radius: 16px; background: var(--surface-2); }
.mac .t { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.mac .t i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.mac .v { font-size: 18px; font-weight: 750; margin: 2px 0 8px; font-variant-numeric: tabular-nums; }
.mac .v small { font-size: 12px; font-weight: 500; color: var(--muted); }
.bar { height: 6px; border-radius: 99px; background: color-mix(in srgb, var(--muted) 18%, transparent); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; transition: width .4s ease; }
/* water */
.water { display: flex; align-items: center; gap: 12px; }
.drops { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
.drop {
  width: 20px; height: 20px; border-radius: 50% 0 50% 50%; transform: rotate(-45deg);
  border: 2px solid var(--water); opacity: .4; transition: all .2s;
}
.drop.on { background: linear-gradient(135deg, color-mix(in srgb, var(--water) 60%, #fff), var(--water)); opacity: 1; }
.roundbtn {
  width: 40px; height: 40px; border-radius: 50%; border: 0; display: grid; place-items: center; font-size: 22px; line-height: 1;
  background: var(--brand-soft); color: var(--brand); font-weight: 600;
}
.roundbtn.solid { background: var(--brand); color: #fff; box-shadow: 0 4px 12px color-mix(in srgb, var(--brand) 35%, transparent); }
/* meals */
.meal-head { display: flex; align-items: center; gap: 12px; }
.meal-ic { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; font-size: 24px; flex: none; }
.meal-ic.breakfast { background: var(--meal-breakfast); }
.meal-ic.lunch { background: var(--meal-lunch); }
.meal-ic.snacks { background: var(--meal-snacks); }
.meal-ic.dinner { background: var(--meal-dinner); }
.meal-head .mt { flex: 1; min-width: 0; }
.meal-head h3 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
.meal-head .sub { font-size: 13px; color: var(--muted); }
.entries { list-style: none; margin: 10px 0 0; padding: 0; }
.entries li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px dashed var(--line); }
.entries .name { flex: 1; min-width: 0; }
.entries .name div:first-child { font-size: 15px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entries .name div:last-child { font-size: 12.5px; color: var(--muted); }
.entries .k { font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 700; }
.entries .k small { font-weight: 500; color: var(--muted); font-size: 11px; margin-left: 2px; }
.del { border: 0; background: var(--surface-2); color: var(--muted); font-size: 16px; width: 28px; height: 28px; border-radius: 9px; }
.empty { color: var(--muted); font-size: 13.5px; margin: 6px 0 0; }
.addbtn {
  border: 0; background: var(--brand-soft); color: var(--brand); font-weight: 650; font-size: 14px;
  padding: 7px 12px; border-radius: 10px;
}
/* bottom nav */
nav.tabs {
  position: fixed; bottom: calc(12px + env(safe-area-inset-bottom)); left: 0; right: 0; z-index: 6;
  display: flex; justify-content: center; padding: 0 16px; pointer-events: none;
}
nav.tabs .inner {
  display: flex; width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 22px; padding: 6px; gap: 4px; box-shadow: 0 8px 28px rgba(0,0,0,.12); pointer-events: auto;
}
nav.tabs button {
  flex: 1; border: 0; background: none; padding: 8px 4px; font-size: 12px; color: var(--muted); border-radius: 16px;
  display: grid; justify-items: center; gap: 1px; transition: background .2s, color .2s;
}
nav.tabs button .ic { font-size: 20px; line-height: 1.1; }
nav.tabs button[aria-current="page"] { color: var(--brand); background: var(--brand-soft); font-weight: 700; }
/* forms */
label.f { display: grid; gap: 5px; font-size: 13.5px; color: var(--muted); font-weight: 500; }
input[type=number], input[type=text], input[type=search], input[type=date], select {
  width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 16px; color: var(--text);
}
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: flex; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { flex: 1; border: 0; background: none; padding: 9px 6px; border-radius: 10px; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--brand); font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.primary {
  width: 100%; border: 0; color: #fff; font-weight: 700; padding: 14px; border-radius: 16px; font-size: 16px;
  background: linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow: 0 6px 16px color-mix(in srgb, var(--brand) 30%, transparent);
}
:root[data-theme="dark"] .primary { color: #06221b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .primary { color: #06221b; } }
.ghost { width: 100%; border: 1px solid var(--line); background: var(--surface); padding: 12px; border-radius: 14px; font-weight: 600; }
.danger { color: var(--danger); }
.stack { display: grid; gap: 12px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.stat-row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.stat-row b { font-variant-numeric: tabular-nums; }
/* onboarding */
.hero { padding: calc(28px + env(safe-area-inset-top)) 0 6px; text-align: center; }
.hero img { width: 76px; height: 76px; border-radius: 22px; box-shadow: var(--shadow-lg); }
.hero h1 { font-size: 28px; margin: 14px 0 6px; letter-spacing: -.03em; }
.hero p { margin: 0 auto; color: var(--muted); max-width: 340px; }
.badges { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.badges span { font-size: 12.5px; padding: 6px 10px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); font-weight: 600; }
/* sheet */
.sheet-back { position: fixed; inset: 0; background: rgba(10,20,17,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease; }
.sheet {
  background: var(--bg); width: 100%; max-width: 520px; height: 92vh; border-radius: 26px 26px 0 0;
  display: flex; flex-direction: column; overflow: hidden; animation: up .22s ease;
}
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet-head { padding: 10px 16px 12px; display: grid; gap: 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
.sheet-head::before { content: ""; width: 40px; height: 4px; border-radius: 4px; background: var(--line); justify-self: center; }
.sheet-head .row { display: flex; align-items: center; gap: 8px; }
.sheet-head .row h2 { margin: 0; flex: 1; font-size: 18px; letter-spacing: -.01em; }
.sheet-body { overflow-y: auto; padding: 8px 16px 28px; flex: 1; }
.results { list-style: none; padding: 0; margin: 0; }
.results li button {
  width: 100%; text-align: left; border: 0; background: none; padding: 10px 2px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px;
}
.fic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 20px; background: var(--surface-2); flex: none; }
.results .n { flex: 1; min-width: 0; }
.results .n div:first-child { font-weight: 550; }
.results .n div:last-child { font-size: 12.5px; color: var(--muted); }
.kpill { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 5px 9px; border-radius: 99px; background: var(--accent-soft); color: color-mix(in srgb, var(--accent) 70%, var(--text)); white-space: nowrap; }
.section-label { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 16px 0 2px; font-weight: 700; }
.pick-head { display: flex; align-items: center; gap: 12px; margin: 14px 0 2px; }
.pick-head .fic { width: 52px; height: 52px; font-size: 26px; border-radius: 16px; }
.pick-head h3 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
.qty { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 16px 0; }
.qty button { width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--brand-soft); color: var(--brand); font-size: 26px; font-weight: 600; }
.qty output { font-size: 36px; font-weight: 800; min-width: 70px; text-align: center; font-variant-numeric: tabular-nums; }
.nutri { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; margin: 12px 0 18px; }
.nutri div { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 4px; }
.nutri div:first-child { background: var(--accent-soft); border-color: transparent; }
.nutri b { display: block; font-size: 19px; font-variant-numeric: tabular-nums; }
.nutri span { font-size: 12px; color: var(--muted); }
.chart { width: 100%; height: auto; display: block; }
.wlist { list-style: none; margin: 0; padding: 0; }
.wlist li { display: flex; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); gap: 8px; font-size: 15px; }
.wlist li span:first-child { flex: 1; color: var(--muted); }
.wsum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 4px; }
.wsum div { background: var(--surface-2); border-radius: 16px; padding: 12px 10px; }
.wsum span { font-size: 12px; color: var(--muted); display: block; }
.wsum b { font-size: 18px; font-variant-numeric: tabular-nums; }
.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 99px; font-size: 14px; font-weight: 600; z-index: 40;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
.note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
@media (max-width: 370px) {
  .hero-main { grid-template-columns: 1fr; justify-items: center; }
  .hero-stats { width: 100%; grid-template-columns: repeat(3, 1fr); }
  .pill { flex-direction: column; gap: 0; padding: 8px 6px; text-align: center; }
  .macros { gap: 6px; }
  .mac { padding: 10px 8px; }
  .brand img { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs" hidden>
  <div class="inner">
    <button data-tab="today"><span class="ic">🍽️</span>Today</button>
    <button data-tab="weight"><span class="ic">⚖️</span>Weight</button>
    <button data-tab="settings"><span class="ic">⚙️</span>Settings</button>
  </div>
</nav>
<div id="sheet-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="foods.js"></script>
<script>
(function () {
  "use strict";
  var KEY = "indi-calorie-counter:v1";
  var MEALS = [["breakfast", "Breakfast"], ["lunch", "Lunch"], ["snacks", "Snacks"], ["dinner", "Dinner"]];
  var ACTIVITY = [
    ["1.2", "Mostly sitting (desk job, little walking)"],
    ["1.375", "Lightly active (walk / exercise 1–3 days)"],
    ["1.55", "Active (exercise 3–5 days)"],
    ["1.725", "Very active (hard exercise 6–7 days)"]
  ];

  // ---------- Food list ----------
  function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, ""); }
  var BUILTIN = (window.INDI_FOODS || []).map(function (r) {
    return { id: "b:" + slug(r[0]), name: r[0], aliases: r[1], unit: r[2], kcal: r[3], p: r[4], c: r[5], f: r[6], cat: r[7], recipe: r[8] || "" };
  });

  // ---------- Storage ----------
  function blank() { return { v: 1, profile: null, targetOverride: null, logs: {}, weights: [], custom: [], recent: [] }; }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return blank();
      var s = JSON.parse(raw);
      return valid(s) ? Object.assign(blank(), s) : blank();
    } catch (e) { return blank(); }
  }
  function valid(s) {
    return s && typeof s === "object" && typeof s.logs === "object" && Array.isArray(s.weights) && Array.isArray(s.custom);
  }
  var storageOk = true;
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; }
    catch (e) { if (storageOk) toast("Couldn't save on this device. Check browser storage settings."); storageOk = false; }
  }

  var state = load();
  var ui = { tab: "today", date: todayKey(), sheet: null };

  // ---------- Helpers ----------
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function keyOf(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayKey() { return keyOf(new Date()); }
  function parseKey(k) { var a = k.split("-").map(Number); return new Date(a[0], a[1] - 1, a[2]); }
  function shiftKey(k, days) { var d = parseKey(k); d.setDate(d.getDate() + days); return keyOf(d); }
  function prettyDate(k) {
    var t = todayKey();
    if (k === t) return "Today";
    if (k === shiftKey(t, -1)) return "Yesterday";
    return parseKey(k).toLocaleDateString(undefined, { day: "numeric", month: "short" });
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
  }
  function r0(n) { return Math.round(n); }
  function r1(n) { return Math.round(n * 10) / 10; }
  function fmtQty(q) { return (Math.round(q * 100) / 100).toString(); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function num(v) { var n = parseFloat(v); return isFinite(n) ? n : NaN; }

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }

  // ---------- Targets ----------
  function latestWeight() {
    if (state.weights.length) {
      var w = state.weights.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      return w[w.length - 1].kg;
    }
    return state.profile ? state.profile.weightKg : 0;
  }
  function targets() {
    var p = state.profile;
    var w = latestWeight();
    var bmr = 10 * w + 6.25 * p.heightCm - 5 * p.age + (p.sex === "male" ? 5 : -161);
    var tdee = bmr * p.activity;
    var change = p.goal === "maintain" ? 0 : (p.rate * 7700) / 7 * (p.goal === "lose" ? -1 : 1);
    var floor = p.sex === "male" ? 1500 : 1200;
    var computed = Math.max(floor, Math.round((tdee + change) / 10) * 10);
    var kcal = state.targetOverride || computed;
    var protein = Math.round(w * (p.goal === "maintain" ? 1.0 : 1.2));
    var fat = Math.round((kcal * 0.25) / 9);
    var carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
    return { kcal: kcal, computed: computed, tdee: Math.round(tdee), floorHit: computed === floor && tdee + change < floor, protein: protein, fat: fat, carbs: carbs };
  }

  // ---------- Day data ----------
  function day(k, create) {
    var d = state.logs[k];
    if (!d && create) {
      d = state.logs[k] = { meals: { breakfast: [], lunch: [], snacks: [], dinner: [] }, water: 0 };
    }
    return d || { meals: { breakfast: [], lunch: [], snacks: [], dinner: [] }, water: 0 };
  }
  function totals(list) {
    return list.reduce(function (t, e) {
      t.kcal += e.kcal * e.qty; t.p += e.p * e.qty; t.c += e.c * e.qty; t.f += e.f * e.qty; return t;
    }, { kcal: 0, p: 0, c: 0, f: 0 });
  }
  function dayTotals(d) {
    var all = [];
    MEALS.forEach(function (m) { all = all.concat(d.meals[m[0]] || []); });
    return totals(all);
  }

  function ring(consumed, target) {
    var r = 62, c = 2 * Math.PI * r;
    var pct = target > 0 ? Math.min(consumed / target, 1) : 0;
    var over = consumed > target;
    var left = r0(target - consumed);
    return '<div class="ring"><svg width="148" height="148" viewBox="0 0 148 148" aria-hidden="true">' +
      '<circle cx="74" cy="74" r="' + r + '" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="13"/>' +
      '<circle cx="74" cy="74" r="' + r + '" fill="none" stroke="' + (over ? "#ffb3a7" : "#ffffff") + '" stroke-width="13" stroke-linecap="round" ' +
      'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (c * (1 - pct)).toFixed(1) + '" style="transition:stroke-dashoffset .5s ease"/></svg>' +
      '<div class="center"><div class="big">' + Math.abs(left) + '</div>' +
      '<div class="lbl">' + (over ? "kcal over" : "kcal left") + '</div></div></div>';
  }

  function macro(label, val, target, color) {

  function weightView() {
    var w = state.weights.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });

      chart(w) + '</section>' +

  function chart(w) {
    if (w.length < 2) return '<p class="empty">Log your weight on two or more days to see a trend.</p>';
    var W = 320, H = 160, P = 28;
    var t0 = parseKey(w[0].date).getTime(), t1 = parseKey(w[w.length - 1].date).getTime();
    var kgs = w.map(function (e) { return e.kg; });
    var lo = Math.floor(Math.min.apply(null, kgs) - 1), hi = Math.ceil(Math.max.apply(null, kgs) + 1);
    function x(e) { return P + (t1 === t0 ? 0.5 : (parseKey(e.date).getTime() - t0) / (t1 - t0)) * (W - P - 10); }
    function y(kg) { return 10 + (1 - (kg - lo) / (hi - lo)) * (H - 30); }
    var pts = w.map(function (e) { return x(e).toFixed(1) + "," + y(e.kg).toFixed(1); }).join(" ");
    var dots = w.map(function (e) { return '<circle cx="' + x(e).toFixed(1) + '" cy="' + y(e.kg).toFixed(1) + '" r="3.5" fill="var(--brand)"/>'; }).join("");
    var fmt = function (k) { return parseKey(k).toLocaleDateString(undefined, { day: "numeric", month: "short" }); };
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Weight trend from ' + w[0].kg + ' to ' + w[w.length - 1].kg + ' kg">' +
      '<line x1="' + P + '" x2="' + (W - 10) + '" y1="' + y(hi) + '" y2="' + y(hi) + '" stroke="var(--line)"/>' +
      '<line x1="' + P + '" x2="' + (W - 10) + '" y1="' + y(lo) + '" y2="' + y(lo) + '" stroke="var(--line)"/>' +
      '<text x="0" y="' + (y(hi) + 4) + '" font-size="11" fill="var(--muted)">' + hi + '</text>' +
      '<text x="0" y="' + (y(lo) + 4) + '" font-size="11" fill="var(--muted)">' + lo + '</text>' +
      '<polyline points="' + pts + '" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' + dots +
      '<text x="' + P + '" y="' + (H - 4) + '" font-size="11" fill="var(--muted)">' + esc(fmt(w[0].date)) + '</text>' +
      '<text x="' + (W - 10) + '" y="' + (H - 4) + '" font-size="11" fill="var(--muted)" text-anchor="end">' + esc(fmt(w[w.length - 1].date)) + '</text></svg>';
  }

  function profileFields(p) {
    p = p || { sex: "female", age: "", heightCm: "", weightKg: "", activity: 1.375, goal: "lose", rate: 0.5 };
    var act = ACTIVITY.map(function (a) { return '<option value="' + a[0] + '"' + (Number(a[0]) === Number(p.activity) ? " selected" : "") + '>' + a[1] + '</option>'; }).join("");
    function seg(name, opts, val) {
      return '<div class="seg" data-seg="' + name + '">' + opts.map(function (o) {

  }

  function onboardingView() {

      '<button class="primary" type="submit">Save profile</button></form></section>' +

      (state.custom.length ? '<ul class="wlist">' + state.custom.map(function (f) {

  }

  // ---------- Add-food sheet ----------
  var sheetRoot = document.getElementById("sheet-root");

  function openAdd(meal) {
    ui.sheet = { meal: meal, mode: "search", q: "", pick: null, qty: 1 };
    renderSheet();
    var s = sheetRoot.querySelector("input[type=search]"); if (s) s.focus();
  }
  function closeSheet() { ui.sheet = null; sheetRoot.innerHTML = ""; document.body.style.overflow = ""; }

  function allFoods() {
    return state.custom.map(function (f) { return Object.assign({ cat: "My foods", aliases: "" }, f); }).concat(BUILTIN);
  }
  function findFood(id) { var a = allFoods(); for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }

  // Spelling-tolerant search for Hinglish: aalu/aloo, mung/moong, bada/vada, laddu/ladoo, rasgula/rasgulla, kele/kela.
  var STOP = { ka: 1, ki: 1, ke: 1, aur: 1, with: 1, and: 1, the: 1, of: 1, wala: 1, wali: 1, vala: 1, vali: 1 };
  var CAT_WORDS = {
    "Sweets": "mithai mithaai meetha mitha sweet sweets dessert",
    "Light snacks": "snack snacks nashta namkeen",
    "Samosa, kachori & fried": "snack snacks nashta tala fried pakode",
    "Chaat & street food": "snack snacks nashta chaat street",
    "Chai, coffee & milk": "drink",
    "Drinks": "drink drinks sharbat",
    "Fruits": "fruit fal phal",
    "Sabzi": "sabji sabzi subzi",
    "Breads": "bread"
  };
  function norm(s) {
    s = String(s).toLowerCase().replace(/[^a-z0-9]+/g, " ");
    s = s.replace(/ph/g, "f").replace(/([bkgdtcsj])h/g, "$1").replace(/w/g, "v").replace(/b/g, "v")
      .replace(/z/g, "j").replace(/q/g, "k").replace(/ee/g, "i").replace(/oo/g, "u").replace(/y/g, "i");
    s = s.replace(/([a-z])\1+/g, "$1"); // laddu->ladu, rasgulla->rasgula
    return s.split(" ").filter(Boolean).map(function (w) {
      return w.length > 3 ? w.replace(/[aeiou]$/, "") : w; // kela/kele -> kel, vada/bada -> vad
    });
  }
  var searchIndex = null, indexSize = -1;
  function buildIndex() {
    var foods = allFoods();
    if (searchIndex && indexSize === foods.length) return searchIndex;
    searchIndex = foods.map(function (f) {
      return { f: f, name: norm(f.name).join(" "), hay: " " + norm(f.name + " " + (f.aliases || "") + " " + (CAT_WORDS[f.cat] || "")).join(" ") };
    });
    indexSize = foods.length;
    return searchIndex;
  }
  function search(q) {
    var tokens = norm(q).filter(function (t) { return !STOP[t] && t.length > 1; });
    if (!tokens.length) return [];
    return buildIndex().map(function (x) {
      if (!tokens.every(function (t) { return x.hay.indexOf(" " + t) !== -1 || (t.length > 3 && x.hay.indexOf(t) !== -1); })) return null;
      var score = x.name.indexOf(tokens[0]) === 0 ? 0 : (x.name.indexOf(tokens[0]) !== -1 ? 1 : 2);
      return { f: x.f, s: score };
    }).filter(Boolean).sort(function (a, b) { return a.s - b.s || a.f.name.localeCompare(b.f.name); }).map(function (x) { return x.f; });
  }

  function foodRow(f) {

  function sheetBody() {

      return '<div class="pick-head"><span class="fic" aria-hidden="true">' + catIcon(f.cat) + '</span><div><h3>' + esc(f.name) + '</h3>' +

        '<button data-act="qty" data-d="0.5" aria-label="More">+</button></div>' +
        '<div class="nutri"><div><b>' + r0(f.kcal * s.qty) + '</b><span>kcal</span></div><div><b>' + r1(f.p * s.qty) + '</b><span>protein g</span></div>' +
        '<div><b>' + r1(f.c * s.qty) + '</b><span>carbs g</span></div><div><b>' + r1(f.f * s.qty) + '</b><span>fat g</span></div></div>' +
        '<div class="stack"><button class="primary" data-act="confirm-add">Add to ' + mealName(s.meal) + '</button>' +
        '<button class="ghost" data-act="unpick">Back</button></div>' +
        (f.recipe ? '<p class="note"><b>Calculated from this recipe (1 serving):</b> ' + esc(f.recipe) +
          '. Ingredient values: USDA FoodData Central. Your home recipe may differ; for an exact match, save it under “My food”.</p>' : "");
    }
    if (s.mode === "custom") {
      return '<form class="stack" data-form="custom" style="margin-top:12px">' +
        '<label class="f">Food name<input type="text" name="name" maxlength="60" required placeholder="e.g. Mom\'s poha"></label>' +
        '<label class="f">Serving<input type="text" name="unit" maxlength="40" required placeholder="e.g. 1 plate"></label>' +
        '<div class="grid2"><label class="f">Calories (kcal)<input type="number" name="kcal" inputmode="decimal" min="0" max="5000" step="1" required></label>' +
        '<label class="f">Protein (g)<input type="number" name="p" inputmode="decimal" min="0" max="500" step="0.1" value="0"></label>' +
        '<label class="f">Carbs (g)<input type="number" name="c" inputmode="decimal" min="0" max="500" step="0.1" value="0"></label>' +
        '<label class="f">Fat (g)<input type="number" name="f" inputmode="decimal" min="0" max="500" step="0.1" value="0"></label></div>' +
        '<button class="primary" type="submit">Save and add</button>' +
        '<p class="note">Check the nutrition label on packaged food for exact values.</p></form>';
    }
    if (s.mode === "quick") {
      return '<form class="stack" data-form="quick" style="margin-top:12px">' +
        '<label class="f">What did you eat? (optional)<input type="text" name="name" maxlength="60" placeholder="Quick add"></label>' +
        '<label class="f">Calories (kcal)<input type="number" name="kcal" inputmode="numeric" min="1" max="5000" required></label>' +
        '<button class="primary" type="submit">Add</button></form>';
    }
    var q = s.q.trim();
    if (q) {
      var res = search(q);
      return res.length ? '<ul class="results">' + res.slice(0, 60).map(foodRow).join("") + '</ul>'
        : '<p class="empty" style="margin-top:16px">No match for “' + esc(q) + '”. Try another spelling, or add it under “My food”.</p>';
    }
    var recent = state.recent.map(findFood).filter(Boolean).slice(0, 8);
    var html = "";
    if (recent.length) html += '<div class="section-label">Recent</div><ul class="results">' + recent.map(foodRow).join("") + '</ul>';
    var cats = {};
    allFoods().forEach(function (f) { (cats[f.cat] = cats[f.cat] || []).push(f); });
    Object.keys(cats).forEach(function (c) { html += '<div class="section-label">' + esc(c) + '</div><ul class="results">' + cats[c].map(foodRow).join("") + '</ul>'; });
    return html;
  }

  function mealName(k) { for (var i = 0; i < MEALS.length; i++) if (MEALS[i][0] === k) return MEALS[i][1]; return k; }

  function renderSheet() {
    var s = ui.sheet; if (!s) return;
    var mealOpts = MEALS.map(function (m) { return '<option value="' + m[0] + '"' + (m[0] === s.meal ? " selected" : "") + '>' + m[1] + '</option>'; }).join("");
    var modeSeg = '<div class="seg" data-mode>' + [["search", "Search"], ["custom", "My food"], ["quick", "Quick kcal"]].map(function (m) {
      return '<button type="button" data-act="mode" data-mode="' + m[0] + '" aria-pressed="' + (s.mode === m[0]) + '">' + m[1] + '</button>';
    }).join("") + '</div>';
    var existing = sheetRoot.querySelector(".sheet");
    if (existing && s.mode === "search" && !s.pick && existing.dataset.mode === "search") {
      // keep the search box (and keyboard) in place, only refresh results
      existing.querySelector(".sheet-body").innerHTML = sheetBody();
      return;
    }
    sheetRoot.innerHTML = '<div class="sheet-back" data-act="backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-label="Add food" data-mode="' + (s.pick ? "pick" : s.mode) + '">' +
      '<div class="sheet-head"><div class="row"><h2>Add food</h2><select data-meal-select aria-label="Meal" style="width:auto">' + mealOpts + '</select>' +
      '<button class="iconbtn" data-act="close" aria-label="Close">×</button></div>' +
      (s.pick ? "" : modeSeg) +
      (s.mode === "search" && !s.pick ? '<input type="search" placeholder="Search dal, roti, poha, chai…" value="' + esc(s.q) + '" aria-label="Search foods" autocomplete="off">' : "") +
      '</div><div class="sheet-body">' + sheetBody() + '</div></div></div>';
    document.body.style.overflow = "hidden";
  }

  function addEntry(meal, f, qty) {
    var d = day(ui.date, true);
    d.meals[meal].push({ id: uid(), food: f.id, name: f.name, unit: f.unit, qty: qty, kcal: f.kcal, p: f.p, c: f.c, f: f.f });
    if (f.id) {
      state.recent = [f.id].concat(state.recent.filter(function (x) { return x !== f.id; })).slice(0, 20);
    }
    save();
  }

  // ---------- Events ----------
  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-act],[data-tab],[data-val]");
    if (!el) return;
    if (el.dataset.tab) { ui.tab = el.dataset.tab; render(); window.scrollTo(0, 0); return; }
    if (el.dataset.val !== undefined && el.parentElement.dataset.seg) {
      var seg = el.parentElement;
      seg.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b === el)); });
      seg.querySelector("input").value = el.dataset.val;
      if (seg.dataset.seg === "goal") {
        var rate = seg.closest("form").querySelector("[data-rate]");
        if (rate) rate.hidden = el.dataset.val === "maintain";
      }
      return;
    }
    var act = el.dataset.act;
    var s = ui.sheet;
    switch (act) {
      case "prev-day": ui.date = shiftKey(ui.date, -1); render(); break;
      case "next-day": if (ui.date < todayKey()) { ui.date = shiftKey(ui.date, 1); render(); } break;
      case "water": {
        var d = day(ui.date, true);
        d.water = Math.max(0, Math.min(30, d.water + Number(el.dataset.d)));
        save(); render(); break;
      }
      case "open-add": openAdd(el.dataset.meal); break;
      case "del-entry": {
        var dd = day(ui.date, true);
        dd.meals[el.dataset.meal] = dd.meals[el.dataset.meal].filter(function (e) { return e.id !== el.dataset.id; });
        save(); render(); toast("Removed"); break;
      }
      case "backdrop": if (ev.target === el) closeSheet(); break;
      case "close": closeSheet(); break;
      case "mode": s.mode = el.dataset.mode; s.pick = null; renderSheet(); break;
      case "pick": s.pick = el.dataset.id; s.qty = 1; renderSheet(); break;
      case "unpick": s.pick = null; renderSheet(); break;
      case "qty": s.qty = Math.max(0.5, Math.min(20, s.qty + Number(el.dataset.d))); renderSheet(); break;
      case "confirm-add": {
        var f = findFood(s.pick);
        if (f) { addEntry(s.meal, f, s.qty); var meal = s.meal; closeSheet(); render(); toast("Added to " + mealName(meal)); }
        break;
      }
      case "del-weight":
        state.weights = state.weights.filter(function (w) { return w.date !== el.dataset.date; });
        save(); render(); break;
      case "del-custom":
        if (confirm("Delete this food from My foods? Past log entries stay.")) {
          state.custom = state.custom.filter(function (c) { return c.id !== el.dataset.id; });
          state.recent = state.recent.filter(function (x) { return x !== el.dataset.id; });
          save(); render();
        }
        break;
      case "export": exportData(); break;
      case "import": document.getElementById("importFile").click(); break;
      case "reset":
        if (confirm("Delete ALL your data on this device? This can't be undone.")) {
          state = blank(); save(); ui.tab = "today"; ui.date = todayKey(); render();
        }
        break;
    }
  });

  document.addEventListener("input", function (ev) {
    if (ev.target.matches(".sheet input[type=search]") && ui.sheet) { ui.sheet.q = ev.target.value; renderSheet(); }
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.matches("[data-meal-select]") && ui.sheet) { ui.sheet.meal = ev.target.value; if (ui.sheet.pick) renderSheet(); }
    if (ev.target.id === "importFile" && ev.target.files[0]) importData(ev.target.files[0]);
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && ui.sheet) closeSheet(); });

  document.addEventListener("submit", function (ev) {
    var form = ev.target.closest("form[data-form]");
    if (!form) return;
    ev.preventDefault();
    var fd = new FormData(form);
    var kind = form.dataset.form;
    if (kind === "profile") {
      var p = {
        sex: fd.get("sex") === "male" ? "male" : "female",
        age: num(fd.get("age")), heightCm: num(fd.get("heightCm")), weightKg: num(fd.get("weightKg")),
        activity: num(fd.get("activity")), goal: String(fd.get("goal")), rate: num(fd.get("rate"))
      };
      if (!(p.age >= 18 && p.age <= 100)) return toast("This calculator is for ages 18–100.");
      if (!(p.heightCm >= 120 && p.heightCm <= 230)) return toast("Enter height between 120 and 230 cm.");
      if (!(p.weightKg >= 30 && p.weightKg <= 300)) return toast("Enter weight between 30 and 300 kg.");
      if (["lose", "maintain", "gain"].indexOf(p.goal) === -1) p.goal = "maintain";
      if (!(p.rate === 0.25 || p.rate === 0.5)) p.rate = 0.5;
      var first = !state.profile;
      state.profile = p;
      if (first) state.weights = [{ date: todayKey(), kg: p.weightKg }];
      save(); render(); if (first) window.scrollTo(0, 0);
      toast(first ? "Target set. Start logging!" : "Profile saved");
    } else if (kind === "override") {
      var k = num(fd.get("kcal"));
      if (fd.get("kcal") === "" || !isFinite(k)) state.targetOverride = null;
      else if (k < 1000 || k > 6000) return toast("Enter a target between 1000 and 6000 kcal.");
      else state.targetOverride = Math.round(k);
      save(); render(); toast("Target saved");
    } else if (kind === "weight") {
      var date = String(fd.get("date")), kg = num(fd.get("kg"));
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || date > todayKey()) return toast("Pick a valid date.");
      if (!(kg >= 25 && kg <= 300)) return toast("Enter a weight between 25 and 300 kg.");
      state.weights = state.weights.filter(function (w) { return w.date !== date; }).concat([{ date: date, kg: r1(kg) }]);
      save(); render(); toast("Weight saved");
    } else if (kind === "custom") {
      var cf = {
        id: "c:" + uid(), name: String(fd.get("name")).trim(), unit: String(fd.get("unit")).trim(),
        kcal: num(fd.get("kcal")), p: num(fd.get("p")) || 0, c: num(fd.get("c")) || 0, f: num(fd.get("f")) || 0
      };
      if (!cf.name || !cf.unit || !(cf.kcal >= 0)) return toast("Fill in name, serving and calories.");
      state.custom.push(cf); save();
      ui.sheet.mode = "search"; ui.sheet.pick = cf.id; ui.sheet.qty = 1; renderSheet();
    } else if (kind === "quick") {
      var qk = num(fd.get("kcal"));
      if (!(qk > 0)) return toast("Enter calories.");
      var name = String(fd.get("name") || "").trim() || "Quick add";
      addEntry(ui.sheet.meal, { id: null, name: name, unit: "entry", kcal: qk, p: 0, c: 0, f: 0 }, 1);
      var m = ui.sheet.meal; closeSheet(); render(); toast("Added to " + mealName(m));
    }
  });

  function exportData() {
    try {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "indi-calorie-counter-backup-" + todayKey() + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    } catch (e) { toast("Export failed on this browser."); }
  }
  function importData(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var s = JSON.parse(reader.result);
        if (!valid(s) || !s.profile) throw new Error("bad");
        if (!confirm("Replace the data on this device with this backup?")) return;
        state = Object.assign(blank(), s); save(); render(); toast("Backup restored");
      } catch (e) { toast("That file isn't an Indi Calorie Counter backup."); }
    };
    reader.readAsText(file);
  }

  // Midnight rollover: if the app stays open past midnight, move "today" forward.
  var lastToday = todayKey();
  setInterval(function () {
    var t = todayKey();
    if (t !== lastToday) { if (ui.date === lastToday) ui.date = t; lastToday = t; if (!ui.sheet) render(); }
  }, 60000);

  render();

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
